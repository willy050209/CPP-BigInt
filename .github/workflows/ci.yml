name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  cpp23-build-and-test:
    name: ${{ matrix.os }} - C++23
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake (C++23)
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_BUILD_TYPE=Release
          -DBIGINT_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Packaging Scripts
        run: |
          python scripts/bundle_header.py -v
          python scripts/export_module.py -v
          python scripts/test_packaging.py

      - name: Verify C-API Export Script
        run: python scripts/export_c_api.py --verify

      - name: Verify Benchmark Build (Compile-only Check)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -B build_bench -DBIGINT_BUILD_BENCHMARKS=ON -DCMAKE_CXX_STANDARD=23 -DCMAKE_BUILD_TYPE=Release
          cmake --build build_bench --target bench_bigint --config Release

  dotnet-build-and-test:
    name: ${{ matrix.os }} - .NET 10 (C# / F# / VB.NET)
    runs-on: ${{ matrix.os }}
    needs: cpp23-build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Native C-API Library
        shell: bash
        run: |
          cmake -B build_native -DCMAKE_CXX_STANDARD=23 -DCMAKE_BUILD_TYPE=Release -DBIGINT_BUILD_BENCHMARKS=OFF
          cmake --build build_native --target bigint_c --config Release
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p dotnet/src/Numeric.BigInt/runtimes/win-x64/native
            cp build_native/Release/bigint_c.dll dotnet/src/Numeric.BigInt/runtimes/win-x64/native/bigint_c.dll
          else
            mkdir -p dotnet/src/Numeric.BigInt/runtimes/linux-x64/native
            cp build_native/libbigint_c.so dotnet/src/Numeric.BigInt/runtimes/linux-x64/native/libbigint_c.so
          fi

      - name: Build and Test .NET Solution
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet build dotnet/NumericBigInt.slnx -c Release
          dotnet run --no-build -c Release --project dotnet/tests/Numeric.BigInt.Tests.CSharp/Numeric.BigInt.Tests.CSharp.csproj
          dotnet run --no-build -c Release --project dotnet/tests/Numeric.BigInt.Tests.FSharp/Numeric.BigInt.Tests.FSharp.fsproj
          dotnet run --no-build -c Release --project dotnet/tests/Numeric.BigInt.Tests.VB/Numeric.BigInt.Tests.VB.vbproj
